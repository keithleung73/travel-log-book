name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate app
        id: loc
        run: |
          if [ -f travel-log-book-source/package.json ]; then
            echo "dir=travel-log-book-source" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare static export
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f mkpc-latest-source.zip ]; then
  unzip -oq mkpc-latest-source.zip
  rm -f mkpc-latest-source.zip
fiif [ -d mkpc-latest-source ]; then
            cp -a mkpc-latest-source/. .
            rm -rf mkpc-latest-source
          fi
          find . -name '*.tsx' ! -path './node_modules/*' -exec sed -i \
            's|src="/mkpc-crest.png"|src="/travel-log-book/mkpc-crest.png"|g' {} +
          rm -f app/download/route.ts
          mkdir -p lib public
          python3 << 'PY'
          import json
          from pathlib import Path
          p = Path("tsconfig.json")
          if p.exists():
              data = json.loads(p.read_text())
              excl = list(data.get("exclude") or [])
              for item in ["node_modules", "mkpc-latest-source"]:
                  if item not in excl:
                      excl.append(item)
              data["exclude"] = excl
              p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          cat > lib/public-url.ts << 'EOF'
          export function publicUrl(path: string): string {
            const base = process.env.NEXT_PUBLIC_BASE_PATH ?? "";
            const normalized = path.startsWith("/") ? path : `/${path}`;
            return `${base}${normalized}`;
          }
          EOF
          touch public/.nojekyll
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";
          const basePath = process.env.NEXT_PUBLIC_BASE_PATH ?? "";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            trailingSlash: true,
            basePath,
            assetPrefix: basePath || undefined,
          };
          export default nextConfig;
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.loc.outputs.dir }}/package-lock.json
      - name: Install
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm ci
      - name: Build static site
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          NEXT_PUBLIC_BASE_PATH: /travel-log-book
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.loc.outputs.dir }}/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
